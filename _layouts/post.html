---
layout: default
---
<article class="article wrap"><div class="article-meta"><span>{{ page.date | date: "%d %b %Y" }}</span>{% if page.categories %}<span>•</span><span>{{ page.categories | join: " · " }}</span>{% endif %}</div><h1>{{ page.title }}</h1>{% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}<div class="prose">{{ content }}</div><div class="article-end"><a class="button secondary" href="{{ '/blog/' | relative_url }}">← All articles</a></div></article>
