<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header class="site-header">
  <div class="wrap nav">

    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Chhandak Roy — Home">
      <span class="brand-mark">CR</span>
      <span>Chhandak Roy</span>
    </a>

    <nav aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/projects/' | relative_url }}">Projects &amp; Writing</a>
      <a
        href="https://github.com/ChhandakRoy"
        target="_blank"
        rel="noopener noreferrer"
      >GitHub ↗</a>
    </nav>

  </div>
</header>

<main>
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap footer-grid">

    <div>
      <strong>Chhandak Roy</strong>
      <p>VLSI • RTL Design • Verification • FPGA • ASIC</p>
    </div>

    <div class="footer-links">
      <a
        href="https://github.com/ChhandakRoy"
        target="_blank"
        rel="noopener noreferrer"
      >GitHub</a>
    </div>

  </div>

  <div class="wrap footer-bottom">
    Built with GitHub Pages + Jekyll.
  </div>
</footer>


<!-- Mermaid diagrams -->

<script
  src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"
  defer>
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    document.querySelectorAll("pre code.language-mermaid").forEach(function (code) {

      const container = document.createElement("div");

      container.className = "mermaid";
      container.textContent = code.textContent;

      const pre = code.closest("pre");

      if (pre) {
        pre.replaceWith(container);
      }

    });

    if (typeof mermaid !== "undefined") {
      mermaid.initialize({
        startOnLoad: true,
        theme: "neutral",
        securityLevel: "loose"
      });
    }

  });
</script>


</body>
</html>
